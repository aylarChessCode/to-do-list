<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List with Javascipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>To Do List </h1>

        <div class="addTask-box">
            <input type="text" placeholder="Enter task" id="taskInput">
            <button class="addBtn" id="addBtn">ADD</button>
        </div>

        <div class="task-box " id="taskBox">
        </div>
        <button class="clearBtn" id="clearBtn">Clear</button>


    </div>
    <script src="script.js"></script>
</body>
</html>
